<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodyLingo Streak Widget</title>
    <style>
      :root {
        --duo-blue: #4ac0e8;
        --duo-green: #30cf7c;
        --flame: #ffc300;
        --text: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f4f6;
        font-family: Arial, Helvetica, sans-serif;
      }

      .widget {
        width: min(92vw, 390px);
        height: 405px;
        padding: 18px 20px 0;
        border-radius: 34px;
        background: linear-gradient(to bottom, var(--duo-blue), var(--duo-green));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
        position: relative;
        overflow: hidden;
      }

      .widget::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 10%, rgba(255, 0, 0, 0.08), transparent 62%);
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100%;
        text-align: center;
      }

      .streak-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--text);
        margin-top: 4px;
      }

      .flame {
        font-size: 36px;
        line-height: 1;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.22));
        color: var(--flame);
      }

      .streak {
        font-size: clamp(3rem, 7vw, 5rem);
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.08em;
        margin-top: 4px;
        text-shadow: 0 3px 6px rgba(0,0,0,0.14);
      }

      .label {
        margin-top: 10px;
        color: var(--text);
        font-weight: 700;
        font-size: clamp(1.15rem, 3vw, 1.9rem);
        text-shadow: 0 2px 4px rgba(0,0,0,0.16);
        width: 100%;
        text-align: center;
      }

      .mascot-wrap {
        width: 100%;
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 0;
      }

      .mascot {
        width: 460px;
        max-width: 98%;
        object-fit: contain;
        transform: translateY(8px);
        filter: drop-shadow(0 12px 24px rgba(0,0,0,0.18));
      }
    </style>
  </head>
  <body>
    <div class="widget" aria-label="Duolingo style streak widget">
      <div class="content">
        <div class="streak-box">
          <div class="flame" aria-hidden="true">🔥</div>
          <div id="streak" class="streak">0</div>
        </div>

        <div id="label" class="label">Time to code, User!</div>

        <div class="mascot-wrap">
          <img class="mascot" src="public/duo.png" alt="Duolingo mascot" />
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const username = (params.get('username') || params.get('name') || 'octocat').trim();
      const streakEl = document.getElementById('streak');
      const labelEl = document.getElementById('label');

      function formatDateKey(date) {
        return date.toISOString().slice(0, 10);
      }

      function computeStreakInfo(events) {
        if (!Array.isArray(events) || events.length === 0) return { streak: 0, startDateKey: null };

        const activityDays = new Set();
        events.forEach((event) => {
          if (!event || !event.created_at) return;
          const date = new Date(event.created_at);
          if (Number.isNaN(date.getTime())) return;
          activityDays.add(formatDateKey(date));
        });

        if (activityDays.size === 0) return { streak: 0, startDateKey: null };

        const today = new Date();
        const todayKey = formatDateKey(today);
        const yesterday = new Date(Date.UTC(
          today.getUTCFullYear(),
          today.getUTCMonth(),
          today.getUTCDate() - 1
        ));
        const yesterdayKey = formatDateKey(yesterday);

        let cursorKey = null;
        if (activityDays.has(todayKey)) {
          cursorKey = todayKey;
        } else if (activityDays.has(yesterdayKey)) {
          cursorKey = yesterdayKey;
        } else {
          return { streak: 0, startDateKey: null };
        }

        let streak = 0;
        let startDateKey = null;
        let cursor = new Date(`${cursorKey}T00:00:00.000Z`);

        while (activityDays.has(formatDateKey(cursor))) {
          streak += 1;
          startDateKey = formatDateKey(cursor);
          cursor = new Date(Date.UTC(
            cursor.getUTCFullYear(),
            cursor.getUTCMonth(),
            cursor.getUTCDate() - 1
          ));
        }

        return { streak, startDateKey };
      }

      function computeStreak(events) {
        return computeStreakInfo(events).streak;
      }

      async function fetchAllPublicEvents(username) {
        const allEvents = [];
        let oldestDateKey = null;

        for (let page = 1; ; page += 1) {
          const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/events/public?per_page=100&page=${page}`, {
            headers: {
              Accept: 'application/vnd.github+json',
              'User-Agent': 'CodyLingo'
            }
          });

          if (!response.ok) {
            throw new Error('GitHub kullanıcı verisi alınamadı');
          }

          const events = await response.json();
          if (!Array.isArray(events) || events.length === 0) break;

          allEvents.push(...events);

          events.forEach((event) => {
            if (!event || !event.created_at) return;
            const date = new Date(event.created_at);
            if (Number.isNaN(date.getTime())) return;

            const dateKey = formatDateKey(date);
            if (!oldestDateKey || dateKey < oldestDateKey) oldestDateKey = dateKey;
          });

          const streakInfo = computeStreakInfo(allEvents);
          if (streakInfo.streak === 0) break;

          if (streakInfo.startDateKey && oldestDateKey < streakInfo.startDateKey) {
            break;
          }

          if (events.length < 100) break;
        }

        return allEvents;
      }

      async function loadUserStreak() {
        try {
          const events = await fetchAllPublicEvents(username);
          const streak = computeStreak(events);
          streakEl.textContent = String(streak);
        } catch (error) {
          streakEl.textContent = '0';
        }

        labelEl.textContent = `Time to code, ${username}!`;
      }

      loadUserStreak();
    </script>
  </body>
</html>
