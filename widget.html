<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodyLingo Streak Widget</title>
    <style>
      :root {
        --bg-1: #1b2333;
        --bg-2: #0f172a;
        --card-1: #2dd4bf;
        --card-2: #14b8a6;
        --flame: #fbbf24;
        --text: #ecfeff;
        --muted: rgba(236, 254, 255, 0.8);
        --shadow: rgba(15, 23, 42, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #24324d, var(--bg-2) 60%);
        font-family: Arial, Helvetica, sans-serif;
      }

      .widget {
        width: min(92vw, 420px);
        min-height: 250px;
        padding: 26px 26px 22px;
        border-radius: 28px;
        background: linear-gradient(180deg, var(--card-1), var(--card-2));
        box-shadow: 0 22px 50px var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.18);
        position: relative;
        overflow: hidden;
      }

      .widget::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 10%, rgba(255,255,255,0.18), transparent 45%);
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .flame {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: rgba(255,255,255,0.08);
        font-size: 28px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
      }

      .streak {
        font-size: clamp(2.3rem, 6vw, 4.5rem);
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .label {
        color: var(--text);
        font-size: clamp(1.05rem, 2vw, 1.5rem);
        font-weight: 700;
        margin-bottom: 18px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.18);
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(15, 23, 42, 0.18);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .avatar {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(15, 23, 42, 0.18);
        border: 2px solid rgba(255,255,255,0.26);
        color: var(--text);
        font-size: 1.6rem;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="widget" aria-label="Streak widget">
      <div class="content">
        <div class="top">
          <div class="flame" aria-hidden="true">🔥</div>
          <div id="streak" class="streak">95</div>
        </div>

        <div id="label" class="label">Time to code, Coder!</div>

        <div class="meta">
          <div class="tag">Daily streak</div>
          <div id="avatar" class="avatar" aria-label="User initial">C</div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const streakValue = Number(params.get('streak') || 95);
      const nameValue = params.get('name') || 'Coder';
      const labelValue = params.get('label') || 'Time to code';

      document.getElementById('streak').textContent = String(streakValue);
      document.getElementById('label').textContent = `${labelValue}, ${nameValue}!`;
      document.getElementById('avatar').textContent = (nameValue || 'C').trim().charAt(0).toUpperCase();
    </script>
  </body>
</html>
